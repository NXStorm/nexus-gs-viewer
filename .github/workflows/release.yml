name: Release builds

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/package.mjs win32 x64
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path "release/NEXUS GS Viewer-win32-x64" -DestinationPath "NEXUS-GS-Viewer-win32-x64.zip"
      - uses: softprops/action-gh-release@v2
        with:
          files: NEXUS-GS-Viewer-win32-x64.zip

  macos:
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build .icns from icon.png
        run: |
          mkdir icon.iconset
          for s in 16 32 64 128 256; do
            sips -z $s $s build/icon.png --out icon.iconset/icon_${s}x${s}.png >/dev/null
          done
          cp icon.iconset/icon_32x32.png icon.iconset/icon_16x16@2x.png
          cp icon.iconset/icon_64x64.png icon.iconset/icon_32x32@2x.png
          cp icon.iconset/icon_256x256.png icon.iconset/icon_128x128@2x.png
          iconutil -c icns icon.iconset -o build/icon.icns
      - run: node scripts/package.mjs darwin ${{ matrix.arch }}
      - name: Ad-hoc codesign
        # Apple Silicon refuse de lancer un binaire sans signature valide ;
        # le repackaging invalide celle d'Electron → on re-signe ad hoc.
        run: codesign --force --deep --sign - "release/NEXUS GS Viewer-darwin-${{ matrix.arch }}/NEXUS GS Viewer.app"
      - name: Zip (ditto preserves symlinks and permissions)
        run: |
          cd "release/NEXUS GS Viewer-darwin-${{ matrix.arch }}"
          ditto -c -k --sequesterRsrc --keepParent "NEXUS GS Viewer.app" "../../NEXUS-GS-Viewer-macos-${{ matrix.arch }}.zip"
      - uses: softprops/action-gh-release@v2
        with:
          files: NEXUS-GS-Viewer-macos-${{ matrix.arch }}.zip
